<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bite | Sandbox Payment Test</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script><style>body{font:16px system-ui;background:#f5f6fb;color:#182238;margin:0;padding:24px}.card{max-width:520px;margin:40px auto;background:white;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0001}button{padding:13px 20px;border:0;border-radius:10px;background:#6550d8;color:white;font-weight:700}button:disabled{opacity:.5}input{padding:12px;border:1px solid #ddd;border-radius:8px;width:100%;box-sizing:border-box;margin:8px 0 14px}#status{white-space:pre-wrap;line-height:1.6}.note{color:#596277;font-size:14px}</style></head><body><div class="card"><h1>Bite Sandbox Payment Test</h1><p class="note">यह केवल Cashfree Test Environment का ₹1 नकली भुगतान है। कोई असली पैसा नहीं कटेगा और कोई Restaurant Order नहीं बनेगा।</p><p id="status">पहले अपने Bite Customer Account में Login करें।</p><form id="login"><input type="email" id="email" placeholder="Customer email" required><input type="password" id="password" placeholder="Password" required><button>Login</button></form><hr><button id="pay" disabled>Start ₹1 Sandbox Payment</button><p class="note">अगर Cashfree में payment status सफल दिखे तो भी यह वास्तविक बिक्री नहीं है।</p><p><a href="customer.html">Back to Bite Customer Website</a></p></div><script>const sb=supabase.createClient('https://wedbgpybbgsszcmffoha.supabase.co','sb_publishable_9rvWwRCJ86dz13perbmcSg_SE4iFnXn');const status=document.getElementById('status'),pay=document.getElementById('pay'),login=document.getElementById('login');async function refresh(){const {data:{session}}=await sb.auth.getSession();pay.disabled=!session;login.hidden=!!session;status.textContent=session?'Customer logged in. Sandbox test ready.':'Login required.'}login.onsubmit=async e=>{e.preventDefault();status.textContent='Logging in...';const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error){status.textContent=error.message;return}refresh()};pay.onclick=async()=>{pay.disabled=true;status.textContent='Creating Cashfree Sandbox session...';try{const {data,error}=await sb.functions.invoke('cashfree-sandbox-smoke-test',{body:{}});if(error){let details='';try{const response=error.context;if(response&&typeof response.json==='function'){const d=await response.json();details=d.provider_message||d.error||''}}catch{}throw new Error(details||error.message)}if(!data?.payment_session_id)throw Error('No payment session returned');status.textContent='Cashfree sandbox opening...';const cf=Cashfree({mode:'sandbox'});const result=await cf.checkout({paymentSessionId:data.payment_session_id,redirectTarget:'_modal'});if(result?.error)throw Error(result.error.message||'Checkout failed');status.textContent='Checkout closed. Check Cashfree Test Transactions for the result. No real order was created.'}catch(e){status.textContent='Test failed: '+e.message}finally{pay.disabled=false}};refresh();</script></body></html>
