name: Bite QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend scripts and critical guards
        run: |
          python scripts/check_frontend.py
          python -m unittest scripts.verify_live_pages_test scripts.live_public_guest_browser_test
          python scripts/check_owner_structure.py
          node --test scripts/*.test.cjs
          python scripts/build_static_site.py
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run Chromium customer journey smoke tests
        run: |
          python scripts/checkin_scenarios_browser.py
          python scripts/checkin_photo_review_browser.py
          python scripts/hotel_bill_workflow_browser.py
          python scripts/hotel_accounts_browser.py
          python scripts/menu_qr_browser_smoke.py
          python scripts/owner_feedback_mobile_browser.py
          python scripts/delivery_handoff_mobile_browser.py
          python scripts/browser_smoke.py
          python scripts/browser_completion.py
          python scripts/owner_cash_closing_smoke.py
          python scripts/pos_payment_browser_smoke.py
          python scripts/owner_mobile_navigation_smoke.py
          python scripts/universal_owner_browser.py
          python scripts/owner_remaining_browser.py
          python scripts/guest_documents_browser.py

      - name: Upload synthetic QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bite-ui-qa-${{ github.sha }}
          path: |
            dist/launch-qa/browser-evidence.json
            dist/launch-qa/ui-*.png
            dist/launch-qa/owner-feedback-mobile-evidence.json
            dist/launch-qa/universal-owner-browser-evidence.json
            dist/launch-qa/owner-remaining-browser-evidence.json
            dist/launch-qa/guest-documents-browser-evidence.json
            dist/launch-qa/hotel-accounts-browser-evidence.json
            dist/launch-qa/checkin-25-scenarios-evidence.json
            dist/launch-qa/checkin-photo-review-evidence.json
            dist/launch-qa/hotel-bill-workflow-evidence.json
            dist/launch-qa/hotel-ledger.xlsx
            dist/launch-qa/receipt.pdf
            dist/launch-qa/guest-hotel-bill.pdf
          if-no-files-found: ignore

  cashbook-postgres-qa:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bite_cashbook_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bite_cashbook_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bite_cashbook_ci
    steps:
      - uses: actions/checkout@v4
      - name: Verify closing migration on ephemeral PostgreSQL 17
        run: |
          psql --version
          psql -v ON_ERROR_STOP=1 -f scripts/cashbook_postgres_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113212500_cashbook_day_serialization.sql
          psql -v ON_ERROR_STOP=1 -f scripts/cashbook_closing_db_test.sql
          psql -v ON_ERROR_STOP=1 -f scripts/cashbook_production_view_parity.sql
          psql -v ON_ERROR_STOP=1 -f scripts/cashbook_rls_role_matrix.sql
          psql -v ON_ERROR_STOP=1 -f scripts/cashbook_release_preflight_readonly.sql
          bash scripts/cashbook_concurrency_smoke.sh
          bash scripts/cashbook_close_vs_write_smoke.sh
          psql -v ON_ERROR_STOP=1 -f scripts/cashfree_vendor_candidates_fixture.sql
          psql -v ON_ERROR_STOP=1 -f docs/sql/cashfree_vendor_candidates_staging_proposal.sql
          psql -v ON_ERROR_STOP=1 -f scripts/cashfree_vendor_candidates_db_test.sql

  delivery-handoff-postgres-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bite_delivery_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bite_delivery_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bite_delivery_ci
    steps:
      - uses: actions/checkout@v4
      - name: Load the currently deployed delivery RPC logic into an isolated Postgres service
        run: psql -v ON_ERROR_STOP=1 -f scripts/delivery_handoff_pg_fixture.sql
      - name: Verify tenant protection, OTP lock, token rotation and expiry
        run: psql -v ON_ERROR_STOP=1 -f scripts/delivery_handoff_pg_security_test.sql

  universal-owner-postgres-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bite_hotel_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bite_hotel_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bite_hotel_ci
      PGTZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - name: Verify hotel ledger, tenant and role boundaries on isolated PostgreSQL 17
        run: |
          psql -v ON_ERROR_STOP=1 -f scripts/universal_owner_pg_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261116094006_universal_owner_platform.sql
          psql -v ON_ERROR_STOP=1 -f scripts/owner_completion_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261116104349_owner_operational_completion.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261116105700_owner_room_discount_guard.sql
          psql -v ON_ERROR_STOP=1 -f scripts/owner_pos_guard_fixture.sql
          psql -v ON_ERROR_STOP=1 -f scripts/owner_remaining_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261116135719_owner_remaining_workflows.sql
          psql -v ON_ERROR_STOP=1 -f scripts/guest_documents_storage_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261116164724_guest_document_privacy.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261116165500_guest_document_storage_info.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261116170140_guest_document_proxy_download.sql
          psql -v ON_ERROR_STOP=1 -f scripts/universal_owner_pg_test.sql
          psql -v ON_ERROR_STOP=1 -f scripts/universal_owner_hybrid_pg_test.sql
          psql -v ON_ERROR_STOP=1 -f scripts/universal_owner_advanced_pg_test.sql
          bash scripts/universal_owner_concurrency.sh
          psql -v ON_ERROR_STOP=1 -f scripts/owner_completion_pg_test.sql
          bash scripts/owner_module_race_test.sh
          psql -v ON_ERROR_STOP=1 -f scripts/owner_remaining_pg_test.sql
          psql -v ON_ERROR_STOP=1 -f scripts/owner_remaining_closing_pg_test.sql
          bash scripts/owner_combined_closing_race.sh
          psql -v ON_ERROR_STOP=1 -f scripts/guest_documents_pg_test.sql
          bash scripts/guest_documents_limit_race.sh
          psql -v ON_ERROR_STOP=1 -f scripts/hotel_accounts_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/hotel_guest_register_accounts.sql
          psql -v ON_ERROR_STOP=1 -f supabase/hotel_register_arrival_time.sql
          psql -v ON_ERROR_STOP=1 -f scripts/hotel_accounts_pg_test.sql
          psql -v ON_ERROR_STOP=1 -f supabase/hotel_checkin_guest_flow.sql
          psql -v ON_ERROR_STOP=1 -f scripts/guest_documents_pg_test.sql
          psql -v ON_ERROR_STOP=1 -f scripts/checkin_flow_pg_test.sql
          psql -v ON_ERROR_STOP=1 -f supabase/hotel_checkin_scenarios.sql
          psql -v ON_ERROR_STOP=1 -f supabase/hotel_checkin_room_guard.sql
          psql -v ON_ERROR_STOP=1 -f scripts/checkin_scenarios_pg_test.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261116170330_owner_housekeeping_ui_preferences_20261116.sql
          psql -v ON_ERROR_STOP=1 -f supabase/hotel_bill_workflow.sql
          psql -v ON_ERROR_STOP=1 -f scripts/hotel_bill_workflow_pg_test.sql
