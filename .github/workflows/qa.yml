        run: |
          psql -v ON_ERROR_STOP=1 -f scripts/owner_support_pg_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/owner_support_ticket_foundation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/owner_support_ticket_history_candidate.sql
          psql -v ON_ERROR_STOP=1 -f scripts/owner_support_pg_test.sql
          psql -v ON_ERROR_STOP=1 -f scripts/owner_support_history_pg_test.sql

  customer-reorder-postgres-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bite_reorder_qa
