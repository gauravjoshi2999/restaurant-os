name: Bite QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend scripts and critical guards
        run: |
          python scripts/check_frontend.py
          python scripts/check_owner_structure.py
          node --test scripts/*.test.cjs
          python scripts/build_static_site.py
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run Chromium customer journey smoke tests
        run: |
          python scripts/browser_smoke.py
          python scripts/browser_completion.py
          python scripts/owner_cash_closing_smoke.py
          python scripts/pos_payment_browser_smoke.py
          python scripts/owner_mobile_navigation_smoke.py

      - name: Upload synthetic QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bite-ui-qa-${{ github.sha }}
          path: |
            dist/launch-qa/browser-evidence.json
            dist/launch-qa/ui-*.png
            dist/launch-qa/receipt.pdf
          if-no-files-found: ignore

  cashbook-postgres-qa:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bite_cashbook_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bite_cashbook_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bite_cashbook_ci
    steps:
      - uses: actions/checkout@v4
      - name: Verify closing migration on ephemeral PostgreSQL 17
        run: |
          psql --version
          psql -v ON_ERROR_STOP=1 -f scripts/cashbook_postgres_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113212500_cashbook_day_serialization.sql
          psql -v ON_ERROR_STOP=1 -f scripts/cashbook_closing_db_test.sql
          bash scripts/cashbook_concurrency_smoke.sh
