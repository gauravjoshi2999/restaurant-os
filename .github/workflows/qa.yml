      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bite_reorder_qa
    steps:
      - uses: actions/checkout@v4
      - name: Verify historical prices, customer access and anon security on isolated Postgres
        run: |
          psql -v ON_ERROR_STOP=1 -f scripts/customer_reorder_pg_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261119213000_customer_reorder_historical_price_review.sql
          psql -v ON_ERROR_STOP=1 -f scripts/customer_reorder_pg_test.sql

  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend scripts and critical guards
        run: |
          python scripts/check_frontend.py
          python -m unittest scripts.verify_live_pages_test scripts.live_public_guest_browser_test
          python scripts/check_owner_structure.py
          node --test scripts/*.test.cjs
          python scripts/build_static_site.py
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run Chromium customer journey smoke tests
        run: |
          python scripts/owner_session_recovery_browser.py
          python scripts/super_admin_browser.py
          python scripts/super_admin_pilot_readiness_browser.py
          python scripts/owner_home_compact_browser.py
          python scripts/owner_v3_h04_h05_room_details_browser.py
          python scripts/family_booking_browser.py
          python scripts/owner_guest_controls_browser.py
          python scripts/guest_register_history_browser.py
          python scripts/checkin_scenarios_browser.py
          python scripts/checkin_photo_review_browser.py
          python scripts/hotel_bill_workflow_browser.py
          python scripts/hotel_accounts_browser.py
          python scripts/menu_qr_browser_smoke.py
          python scripts/owner_feedback_mobile_browser.py
          python scripts/delivery_handoff_mobile_browser.py
          python scripts/browser_smoke.py
          python scripts/browser_completion.py
          python scripts/customer_reorder_review_browser.py
          python scripts/customer_support_topics_browser.py
          python scripts/owner_cash_closing_smoke.py
          python scripts/pos_payment_browser_smoke.py
          python scripts/owner_mobile_navigation_smoke.py
          python scripts/universal_owner_browser.py
          python scripts/owner_supplier_dues_browser.py
          python scripts/owner_v3_a05_khata_browser.py
          python scripts/owner_v3_historical_pos_browser.py
          python scripts/owner_v3_a06_settlements_browser.py
          python scripts/owner_v3_a07_inventory_browser.py
          python scripts/owner_v3_a08_attendance_browser.py
          python scripts/owner_v3_a09_staff_payments_browser.py
          python scripts/owner_v3_a10_salary_closing_browser.py
          python scripts/owner_v3_a13_salary_status_browser.py
          python scripts/owner_remaining_browser.py
          python scripts/guest_documents_browser.py

      - name: Upload synthetic QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bite-ui-qa-${{ github.sha }}
          path: |
            dist/launch-qa/super-admin-evidence.json
            dist/launch-qa/super-admin-*.png
            dist/launch-qa/browser-evidence.json
            dist/launch-qa/owner-session-recovery-evidence.json
            dist/launch-qa/ui-*.png
            dist/launch-qa/owner-feedback-mobile-evidence.json
            dist/launch-qa/owner-guest-controls-evidence.json
            dist/launch-qa/guest-controls-*.png
            dist/launch-qa/universal-owner-browser-evidence.json
            dist/launch-qa/owner-remaining-browser-evidence.json
            dist/launch-qa/owner-h04-h05-evidence.json
            dist/launch-qa/owner-h04-h05-*.png
            dist/launch-qa/guest-documents-browser-evidence.json
            dist/launch-qa/hotel-accounts-browser-evidence.json
            dist/launch-qa/supplier-payments-*.png
            dist/launch-qa/khata-v3-*.png
            dist/launch-qa/a06-settlements-*.png
            dist/launch-qa/checkin-25-scenarios-evidence.json
            dist/launch-qa/checkin-photo-review-evidence.json
            dist/launch-qa/guest-register-history-evidence.json
            dist/launch-qa/guest-register.xlsx
            dist/launch-qa/hotel-bill-workflow-evidence.json
            dist/launch-qa/hotel-ledger.xlsx
            dist/launch-qa/receipt.pdf
            dist/launch-qa/guest-hotel-bill.pdf
