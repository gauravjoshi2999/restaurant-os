name: Bite QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend scripts and critical guards
        run: |
          python scripts/check_frontend.py
          python scripts/check_owner_structure.py
          node --test scripts/*.test.cjs
          python scripts/build_static_site.py
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run Chromium customer journey smoke tests
        run: |
          python scripts/browser_smoke.py
          python scripts/browser_completion.py
          python scripts/pos_payment_browser_smoke.py

      - name: Upload synthetic QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bite-ui-qa-${{ github.sha }}
          path: |
            dist/launch-qa/browser-evidence.json
            dist/launch-qa/ui-*.png
            dist/launch-qa/receipt.pdf
          if-no-files-found: ignore
