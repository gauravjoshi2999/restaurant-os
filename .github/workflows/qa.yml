name: Bite QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refund-provider-sync-postgres-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bite_refund_sync_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bite_refund_sync_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bite_refund_sync_qa
    steps:
      - uses: actions/checkout@v4
      - name: Verify provider-observed refunds never duplicate or bypass service permissions
        run: |
          psql -v ON_ERROR_STOP=1 -f scripts/refund_provider_observation_pg_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/verified_refund_observation_candidate.sql
          psql -v ON_ERROR_STOP=1 -f scripts/refund_provider_observation_pg_test.sql

  owner-support-postgres-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bite_owner_support_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
