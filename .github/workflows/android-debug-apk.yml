name: Bite Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [feature/bite-android-apk]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-debug-apk.yml'
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [customer, partner, admin]
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Accept Android SDK licenses
        working-directory: .
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager missing: $SDKMANAGER"
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          RESULT=${PIPESTATUS[1]}
          set -o pipefail
          exit "$RESULT"
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Configure selected Bite app
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = '${{ matrix.app }}';
          const apps = {
            customer: {appId:'in.bite.restaurant',appName:'Bite Customer',url:'https://gauravjoshi2999.github.io/restaurant-os/customer.html'},
            partner: {appId:'in.bite.partner',appName:'Bite Partner',url:'https://gauravjoshi2999.github.io/restaurant-os/?bite_app=partner'},
            admin: {appId:'in.bite.admin',appName:'Bite Admin',url:'https://gauravjoshi2999.github.io/restaurant-os/?bite_app=admin'}
          };
          const config = JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          Object.assign(config, {appId:apps[app].appId,appName:apps[app].appName});
          config.server.url=apps[app].url;
          fs.writeFileSync('capacitor.config.json',JSON.stringify(config,null,2));
          NODE
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Android assets
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bite-${{ matrix.app }}-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
