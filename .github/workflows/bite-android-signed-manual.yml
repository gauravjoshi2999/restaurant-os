name: Bite Android signed APK (manual and automatic)
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android version code (increase for each installable update)'
        required: false
        default: '15'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/bite-android-signed-manual.yml'
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [customer, partner, admin]
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bite-android-apk
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Accept Android SDK licenses
        working-directory: .
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager missing: $SDKMANAGER"
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          RESULT=${PIPESTATUS[1]}
          set -o pipefail
          exit "$RESULT"
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Configure selected Bite app
        shell: bash
        env:
          BITE_VERSION_CODE: ${{ inputs.version_code || '15' }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = '${{ matrix.app }}';
          const version = Number(process.env.BITE_VERSION_CODE);
          if(!Number.isSafeInteger(version)||version<1)throw Error('Invalid app version');
          const apps = {
            customer: {appId:'in.bite.restaurant',appName:'Bite Customer',url:'https://gauravjoshi2999.github.io/restaurant-os/customer.html'},
            partner: {appId:'in.bite.partner',appName:'Bite Partner',url:'https://gauravjoshi2999.github.io/restaurant-os/?bite_app=partner'},
            admin: {appId:'in.bite.admin',appName:'Bite Admin',url:'https://gauravjoshi2999.github.io/restaurant-os/?bite_app=admin'}
          };
          const config = JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          Object.assign(config, {appId:apps[app].appId,appName:apps[app].appName});
          const url=new URL(apps[app].url);
          url.searchParams.set('bite_app',app);
          url.searchParams.set('bite_version',String(version));
          config.server.url=url.toString();
          fs.writeFileSync('capacitor.config.json',JSON.stringify(config,null,2));
          NODE
      - name: Verify app identity and destination before building
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = '${{ matrix.app }}';
          const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
          const expected = {
            customer: ['in.bite.restaurant', '/restaurant-os/customer.html'],
            partner: ['in.bite.partner', '/restaurant-os/'],
            admin: ['in.bite.admin', '/restaurant-os/']
          }[app];
          const url = new URL(cfg.server.url);
          if (cfg.appId !== expected[0] || url.pathname !== expected[1] ||
              url.searchParams.get('bite_app') !== app ||
              url.searchParams.getAll('bite_app').length !== 1 ||
              url.origin !== 'https://gauravjoshi2999.github.io') {
            throw Error('Unsafe app identity or destination: ' + app);
          }
          if (app === 'customer' && url.pathname.endsWith('/index.html')) {
            throw Error('Customer must not open owner/admin workspace');
          }
          console.log('Verified', app, cfg.appId, url.pathname);
          NODE
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Android assets
        run: npx cap sync android
      - name: Preserve WebView login and install native new-order notifications
        run: python3 patch_bite_native.py
      - name: Install Firebase push only when Bite Partner Firebase config is available
        shell: bash
        env:
          BITE_FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.BITE_FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
          BITE_FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.BITE_FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          python3 -m py_compile patch_bite_fcm.py
          # Partner v15: audible Android notifications and verified single-tap order acceptance.
          python3 patch_bite_fcm.py
      - name: Set version code for signed releases
        shell: bash
        env:
          BITE_VERSION_CODE: ${{ inputs.version_code || '15' }}
        run: |
          node -e "const fs=require('fs');const p='android/app/build.gradle';let s=fs.readFileSync(p,'utf8');const v=Number(process.env.BITE_VERSION_CODE);if(!Number.isSafeInteger(v)||v<1)throw Error('Invalid version code');s=s.replace(/versionCode\s+\d+/, 'versionCode '+v);if(!s.includes('versionCode '+v))throw Error('versionCode update failed');fs.writeFileSync(p,s)"
      - name: Build release APK (unsigned)
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Sign release APK with stable private key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BITE_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BITE_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BITE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BITE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Signed release unavailable: configure the four BITE_ANDROID_* repository secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bite-release.jks"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "android/app/build/outputs/apk/release/bite-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/bite-release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "android/app/build/outputs/apk/release/bite-${{ matrix.app }}-release.apk" "android/app/build/outputs/apk/release/bite-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose "android/app/build/outputs/apk/release/bite-${{ matrix.app }}-release.apk"
          rm -f "$RUNNER_TEMP/bite-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: bite-${{ matrix.app }}-signed-release
          path: android-app/android/app/build/outputs/apk/release/bite-${{ matrix.app }}-release.apk
          if-no-files-found: error
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bite-${{ matrix.app }}-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
