name: Bite Android signed APK (manual and automatic)
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android version code (increase for each installable update)'
        required: false
        default: '19'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/bite-android-signed-manual.yml'
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [customer, partner, admin]
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bite-android-apk
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Accept Android SDK licenses
        working-directory: .
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager missing: $SDKMANAGER"
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          RESULT=${PIPESTATUS[1]}
          set -o pipefail
          exit "$RESULT"
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Configure selected Bite app
        shell: bash
        env:
          BITE_VERSION_CODE: ${{ inputs.version_code || (matrix.app == 'customer' && '19' || '18') }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = '${{ matrix.app }}';
          const version = Number(process.env.BITE_VERSION_CODE);
          if(!Number.isSafeInteger(version)||version<1)throw Error('Invalid app version');
          const apps = {
            customer: {appId:'in.bite.restaurant',appName:'Bite Customer',url:'https://gauravjoshi2999.github.io/restaurant-os/customer.html'},
            partner: {appId:'in.bite.partner',appName:'Bite Partner',url:'https://gauravjoshi2999.github.io/restaurant-os/?bite_app=partner'},
            admin: {appId:'in.bite.admin',appName:'Bite Admin',url:'https://gauravjoshi2999.github.io/restaurant-os/?bite_app=admin'}
          };
          const config = JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          Object.assign(config, {appId:apps[app].appId,appName:apps[app].appName});
          const url=new URL(apps[app].url);
          url.searchParams.set('bite_app',app);
          url.searchParams.set('bite_version',String(version));
          config.server.url=url.toString();
          fs.writeFileSync('capacitor.config.json',JSON.stringify(config,null,2));
          NODE
      - name: Verify app identity and destination before building
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = '${{ matrix.app }}';
          const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
          const expected = {
            customer: ['in.bite.restaurant', '/restaurant-os/customer.html'],
            partner: ['in.bite.partner', '/restaurant-os/'],
            admin: ['in.bite.admin', '/restaurant-os/']
          }[app];
          const url = new URL(cfg.server.url);
          if (cfg.appId !== expected[0] || url.pathname !== expected[1] ||
              url.searchParams.get('bite_app') !== app ||
              url.searchParams.getAll('bite_app').length !== 1 ||
              url.origin !== 'https://gauravjoshi2999.github.io') {
            throw Error('Unsafe app identity or destination: ' + app);
          }
          if (app === 'customer' && url.pathname.endsWith('/index.html')) {
            throw Error('Customer must not open owner/admin workspace');
          }
          console.log('Verified', app, cfg.appId, url.pathname);
          NODE
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Android assets
        run: npx cap sync android
      - name: Fetch current Bite icon and approved native FCM fix from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: bite-approved-brand
          sparse-checkout: |
            assets/bite-selected-icon.png
            android-app/patch_bite_fcm.py
            android-app/patch_bite_customer_google.py
            android-app/check_bite_google_provider.py
          sparse-checkout-cone-mode: false
      - name: Prepare native Bite launcher icon tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for native icon sizes
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Apply founder-selected Bite launcher icon to customer, partner and admin APKs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          src=Path('../bite-approved-brand/assets/bite-selected-icon.png')
          if not src.is_file(): raise SystemExit('Official Bite icon missing from main')
          image=Image.open(src).convert('RGBA')
          android=Path('android/app/src/main/res')
          densities={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for density,px in densities.items():
            out=android/('mipmap-'+density);out.mkdir(parents=True,exist_ok=True)
            base=Image.new('RGBA',(px,px),'white')
            logo=image.resize((px,px),Image.Resampling.LANCZOS)
            base.alpha_composite(logo)
            base.save(out/'ic_launcher.png')
            mask=Image.new('L',(px,px),0)
            ImageDraw.Draw(mask).ellipse((0,0,px-1,px-1),fill=255)
            circle=Image.new('RGBA',(px,px),'white')
            circle.alpha_composite(logo)
            circle.putalpha(mask)
            circle.save(out/'ic_launcher_round.png')
            foreground=Image.new('RGBA',(round(px*2.25),round(px*2.25)),(0,0,0,0))
            size=round(px*1.55)
            resized=image.resize((size,size),Image.Resampling.LANCZOS)
            foreground.alpha_composite(resized,((foreground.width-size)//2,(foreground.height-size)//2))
            foreground.save(out/'ic_launcher_foreground.png')
          adaptive=android/'mipmap-anydpi-v26';adaptive.mkdir(parents=True,exist_ok=True)
          for name in ('ic_launcher','ic_launcher_round'):
            (adaptive/(name+'.xml')).write_text(
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">'
              '<background android:drawable="@android:color/white"/>'
              '<foreground android:drawable="@mipmap/ic_launcher_foreground"/>'
              '</adaptive-icon>\n')
          print('Applied current official Bite B icon to all launcher densities.')
          PY
      - name: Preserve WebView login and install native new-order notifications
        run: python3 patch_bite_native.py
      - name: Verify existing Customer Google provider before signed build
        if: matrix.app == 'customer'
        env:
          BITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.BITE_GOOGLE_WEB_CLIENT_ID }}
        run: python3 ../bite-approved-brand/android-app/check_bite_google_provider.py
      - name: Install Customer native Google sign-in
        if: matrix.app == 'customer'
        run: |
          test -n "$BITE_GOOGLE_WEB_CLIENT_ID"
          python3 ../bite-approved-brand/android-app/patch_bite_customer_google.py
          test -s "$(find android/app/src/main/java -name BiteCustomerGooglePlugin.java -print -quit)"
      - name: Install Firebase push only when Bite Partner Firebase config is available
        shell: bash
        env:
          BITE_FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.BITE_FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
          BITE_FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.BITE_FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          # The Android scaffold is deliberately checked out from feature/bite-android-apk;
          # always use the reviewed, latest native Firebase patch from main.
          test -s ../bite-approved-brand/android-app/patch_bite_fcm.py
          cp ../bite-approved-brand/android-app/patch_bite_fcm.py patch_bite_fcm.py
          python3 -m py_compile patch_bite_fcm.py
          # Never publish a signed Partner APK silently missing lock-screen FCM.
          if [ "${{ matrix.app }}" = "partner" ] && [ -z "$BITE_FIREBASE_GOOGLE_SERVICES_JSON_BASE64" ] && [ -z "$BITE_FIREBASE_GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Partner signed release blocked: Firebase Android config secret is missing."
            exit 1
          fi
          # Partner v18: notification channel settings, distinct order/cancellation cards and action buttons.
          python3 patch_bite_fcm.py
          if [ "${{ matrix.app }}" = "partner" ]; then
            test -s android/app/google-services.json || { echo "::error::Partner Firebase config file not generated"; exit 1; }
            SERVICE_FILE="$(find android/app/src/main/java -name BiteFirebaseMessagingService.java -print -quit)"
            test -n "$SERVICE_FILE" && test -s "$SERVICE_FILE" || { echo "::error::Partner Firebase Messaging Service not generated"; exit 1; }
            grep -Fq 'manager.notify(notificationTag,0,builder.build());' "$SERVICE_FILE" || { echo "::error::Distinct notification tags not compiled"; exit 1; }
            grep -Fq 'isCancellation?"bite-cancel-"+requestId' "$SERVICE_FILE" || { echo "::error::Cancellation-specific tag not compiled"; exit 1; }
            grep -Fq 'isApproval?"bite-approval-"+approvalId' "$SERVICE_FILE" || { echo "::error::Owner confirmation request native channel not compiled"; exit 1; }
            grep -Fq 'public void consumeApprovalOpen(PluginCall call)' "$(find android/app/src/main/java -name BiteOwnerPushPlugin.java -print -quit)" || { echo "::error::Approval push open bridge not compiled"; exit 1; }
            grep -Fq 'public void openNotificationSettings(PluginCall call)' "$(find android/app/src/main/java -name BiteOwnerPushPlugin.java -print -quit)" || { echo "::error::Partner v18 notification settings plugin method not compiled"; exit 1; }
            grep -Fq 'activityIntent(id,restaurant,"Accepted")' "$SERVICE_FILE" || { echo "::error::Accept action not compiled"; exit 1; }
            grep -Fq 'activityIntent(id,restaurant,"Rejected")' "$SERVICE_FILE" || { echo "::error::Reject action not compiled"; exit 1; }
            grep -Fq '.BiteFirebaseMessagingService' android/app/src/main/AndroidManifest.xml || { echo "::error::FCM service missing from Android manifest"; exit 1; }
            echo "Verified Partner v18 native FCM, distinct notification tags and order action buttons."
          fi
      - name: Set version code for signed releases
        shell: bash
        env:
          BITE_VERSION_CODE: ${{ inputs.version_code || (matrix.app == 'customer' && '19' || '18') }}
        run: |
          node -e "const fs=require('fs');const p='android/app/build.gradle';let s=fs.readFileSync(p,'utf8');const v=Number(process.env.BITE_VERSION_CODE);if(!Number.isSafeInteger(v)||v<1)throw Error('Invalid version code');s=s.replace(/versionCode\s+\d+/, 'versionCode '+v);if(!s.includes('versionCode '+v))throw Error('versionCode update failed');fs.writeFileSync(p,s)"
      - name: Build release APK (unsigned)
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Sign release APK with stable private key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BITE_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BITE_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BITE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BITE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Signed release unavailable: configure the four BITE_ANDROID_* repository secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bite-release.jks"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "android/app/build/outputs/apk/release/bite-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/bite-release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "android/app/build/outputs/apk/release/bite-${{ matrix.app }}-release.apk" "android/app/build/outputs/apk/release/bite-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose "android/app/build/outputs/apk/release/bite-${{ matrix.app }}-release.apk"
          # OAuth Android registration requires the public release certificate SHA-1, not the key.
          if [ "${{ matrix.app }}" = "customer" ]; then
            CERT_REPORT="$("$BUILD_TOOLS/apksigner" verify --print-certs "android/app/build/outputs/apk/release/bite-customer-release.apk")"
            ACTUAL_SHA256="$(printf '%s\n' "$CERT_REPORT" | awk '/certificate SHA-256 digest:/ {print $NF}' | tr '[:upper:]' '[:lower:]' | sort -u)"
            EXPECTED_SHA256="a1e9c24b1bf379fa264fcddfae77766fa1d5be9681c8f65a638aaa654b0f9b3b"
            printf '%s\n' "$CERT_REPORT" | grep -E "certificate SHA-(1|256) digest:" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "::error::Customer signed release blocked: signing certificate differs from the verified historical Customer APK. Restore the original signing key; do not ask users to uninstall."
              exit 1
            fi
            echo "Verified original Customer release certificate."
          fi
          rm -f "$RUNNER_TEMP/bite-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: bite-${{ matrix.app }}-signed-release
          path: android-app/android/app/build/outputs/apk/release/bite-${{ matrix.app }}-release.apk
          if-no-files-found: error
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bite-${{ matrix.app }}-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
