name: Deploy RestaurantOS to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          for page in ("index.html", "customer.html", "delivery.html"):
              html = pathlib.Path(page).read_text(encoding="utf-8")
              for number, match in enumerate(re.finditer(r"<script([^>]*)>(.*?)</script>", html, re.I | re.S), 1):
                  attrs, source = match.group(1), match.group(2)
                  if re.search(r"\bsrc\s*=", attrs, re.I) or not source.strip():
                      continue
                  check_file = pathlib.Path("/tmp") / f"{page.replace('.html', '')}-{number}.js"
                  check_file.write_text(source, encoding="utf-8")
                  subprocess.run(["node", "--check", str(check_file)], check=True)
                  print(f"JavaScript syntax OK: {page} inline script {number}")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
