name: Deploy RestaurantOS to GitHub Pages
on:
  workflow_run:
    workflows: ["Bite QA"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Approved, QA-passed main commit (full 40-character SHA)"
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
jobs:
  deploy:
    concurrency:
      group: pages
      cancel-in-progress: true
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      BITE_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || inputs.commit_sha }}
    steps:
      - name: Require successful main QA for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$BITE_DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            [[ "$BITE_DEPLOY_SHA" == "$current_main" ]] || { echo "Stale automatic deployment skipped"; exit 1; }
          fi
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$BITE_DEPLOY_SHA&per_page=50")
          jq -e --arg sha "$BITE_DEPLOY_SHA" '.workflow_runs | any(.name == "Bite QA" and .head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success")' <<< "$runs"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BITE_DEPLOY_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check source and package public files
        run: |
          python scripts/check_frontend.py
          python scripts/check_owner_structure.py
          python scripts/build_static_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
          name: github-pages-${{ github.run_attempt }}
      - name: Recheck latest main before automatic publication
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$BITE_DEPLOY_SHA" == "$current_main" ]] || { echo "Main advanced; refusing stale publication"; exit 1; }
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
