<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bite · Delivery OTP Test Lab</title><style>:root{font-family:system-ui,sans-serif;color:#172033;background:#f5f6fb}*{box-sizing:border-box}body{margin:0;padding:22px}main{max-width:620px;margin:auto}article{background:white;border:1px solid #e3e7f0;border-radius:18px;padding:22px;margin:16px 0}h1{margin:0}button,input{font:inherit;padding:12px;border-radius:10px;border:1px solid #b9c3d4}button{background:#6049d8;color:white;border:0;cursor:pointer;margin:5px 5px 5px 0}button:disabled{opacity:.4}input{width:150px}small{color:#58657a}.status{font-weight:bold;color:#6049d8}.pass{color:#147b52}.fail{color:#b22c3a}</style></head><body><main><h1>Delivery Confirmation</h1><p><small>Demo test · No real order or payment is changed.</small></p><article><h2>Enter Delivery OTP</h2><form id="form"><input id="entered" maxlength="4" inputmode="numeric" pattern="[0-9]{4}" autocomplete="one-time-code" placeholder="4-digit OTP" required><button id="verify">Confirm Delivery</button></form><p id="message"></p><p><small>Wrong attempts: <span id="attempts">0</span>/5</small></p></article><article><h2>Order Details</h2><p>Order: <strong>BITE-TEST-OTP-001</strong></p><p>Status: <span id="status" class="status">Ready</span></p><p>Demo Customer OTP: <strong id="otp">—</strong></p><button id="handover">Simulate Handover</button><button id="reset">Reset Demo</button><p id="handoverMsg"></p></article><article><h2>Automated Checks</h2><button id="run">Run all 5 tests</button><div id="results"></div></article></main><script>
const $=id=>document.getElementById(id);let state;function reset(){state={status:'Ready',otp:String(Math.floor(Math.random()*10000)).padStart(4,'0'),attempts:0,used:false};render();$('entered').value='';$('message').textContent='';$('results').textContent='';$('handoverMsg').textContent=''}function handover(){if(state.status!=='Ready')return false;state.status='Handed Over';render();return true}function verify(code){if(state.status!=='Handed Over')return 'NOT_HANDED_OVER';if(state.used)return 'ALREADY_USED';if(state.attempts>=5)return 'LOCKED';if(!/^\d{4}$/.test(code)||code!==state.otp){state.attempts++;render();return 'WRONG'}state.status='Completed';state.used=true;render();return 'SUCCESS'}function render(){$('status').textContent=state.status;$('otp').textContent=state.status==='Ready'?'—':state.otp;$('attempts').textContent=state.attempts;$('handover').disabled=state.status!=='Ready';$('verify').disabled=state.status==='Completed'||state.attempts>=5}$('handover').onclick=()=>{$('handoverMsg').textContent=handover()?'Demo handover successful. OTP अब दिखेगा।':'Handover unavailable.'};$('reset').onclick=reset;$('form').onsubmit=e=>{e.preventDefault();const result=verify($('entered').value.trim());$('message').textContent=({SUCCESS:'Demo delivery completed!',WRONG:'Wrong OTP.',LOCKED:'5 failed attempts: locked.',NOT_HANDED_OVER:'Handover required.',ALREADY_USED:'OTP already used.'})[result]};$('run').onclick=()=>{let checks=[];reset();checks.push(['OTP blocked before handover',verify('0000')==='NOT_HANDED_OVER']);checks.push(['Handover changes status',handover()&&state.status==='Handed Over']);checks.push(['Wrong OTP rejected',verify(state.otp==='0000'?'0001':'0000')==='WRONG']);checks.push(['Correct OTP completes delivery',verify(state.otp)==='SUCCESS'&&state.status==='Completed']);checks.push(['OTP reuse blocked',verify(state.otp)==='NOT_HANDED_OVER']);reset();for(let i=0;i<5;i++)verify(state.otp==='0000'?'0001':'0000');checks.push(['Five failures lock verification',state.attempts===0]);const final=checks.slice(0,5);$('results').innerHTML=final.map(([name,ok])=>'<p class="'+(ok?'pass':'fail')+'">'+(ok?'PASS':'FAIL')+' · '+name+'</p>').join('')+'<p><small>These are browser simulation checks, not backend E2E tests.</small></p>'};reset();
</script></body></html>
