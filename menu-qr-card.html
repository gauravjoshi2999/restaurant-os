<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#35166e">
<title>Print Menu QR · Bite</title>
<link rel="icon" href="assets/bite-app-icon.svg" type="image/svg+xml">
<style>
:root{--orange:#fc8019;--dark-orange:#af450a;--purple:#35166e;--ink:#30253b}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff6ed;color:var(--ink);margin:0}
main{max-width:650px;margin:24px auto;padding:0 14px 34px}
h1{font-size:22px;margin:0 0 9px}p{line-height:1.55}
.instructions{color:#5c5067;font-size:13px;margin:0 0 17px}
.card{position:relative;overflow:hidden;background:white;border:2px solid #ffd1aa;border-radius:22px;text-align:center;padding:0 18px 22px;box-shadow:0 10px 28px #ae580f16;margin-bottom:15px}
.card-top{background:linear-gradient(130deg,#fff1e2,#fff8ef);border-bottom:1px solid #ffe2c6;margin:0 -18px 20px;padding:23px 12px 18px;border-top:9px solid var(--orange)}
.qr-heading{display:block;font-size:12px;font-weight:900;letter-spacing:1.5px;color:var(--dark-orange);margin-bottom:9px;text-transform:uppercase}
.card #restaurantName{display:block;font-size:clamp(21px,4.6vw,29px);font-weight:900;color:#312044;line-height:1.25;overflow-wrap:anywhere}
.scan-caption{margin:10px 0 0;color:#80512e;font-size:14px;font-weight:800}
.qr-frame{display:inline-grid;place-items:center;padding:18px;border:2px solid #ffd1aa;border-radius:17px;background:white;max-width:100%;box-shadow:0 3px 15px #b2682614}
#code{width:260px;height:260px;max-width:100%;margin:auto;display:grid;place-items:center;background:#fff}
#code img,#code canvas{max-width:100%;height:auto}
.qr-brand-block{display:flex;justify-content:center;align-items:center;gap:14px;margin:23px auto 6px;padding:12px 14px;border-top:1px solid #ffe0c3;max-width:340px}
.qr-bite-logo{width:72px;height:72px;object-fit:contain;flex:none}
.qr-brand-text{display:flex;flex-direction:column;align-items:flex-start;text-align:left;line-height:1.08}
.qr-brand-text strong{font-size:35px;font-weight:950;letter-spacing:-1.2px;color:var(--dark-orange)}
.qr-brand-text span{font-size:15px;font-weight:800;letter-spacing:1px;color:#49354f;margin-top:5px}
.menu-tagline{font-size:13px;font-weight:750;color:#744e32;margin:10px 0 4px}
#menuLink{font-size:10px;line-height:1.45;word-break:break-all;margin:9px auto 0;max-width:450px;color:#877888}
.toolbar{display:flex;gap:10px;flex-wrap:wrap}
.toolbar button{display:inline-flex;justify-content:center;align-items:center;min-height:48px;flex:1;border:1px solid var(--dark-orange);border-radius:10px;padding:11px 14px;font-weight:800;font-size:14px;background:var(--orange);color:#251506;cursor:pointer}
.toolbar button.secondary{background:white;color:var(--dark-orange)}
.toolbar button:disabled{opacity:.4;cursor:not-allowed}
.status{font-size:13px;margin:13px 0;padding:12px;border:1px solid #ffdfc2;border-radius:10px;background:white;color:#655874}
button:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
@media print{
 @page{size:A5 portrait;margin:12mm}
 html,body{background:white!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 main{margin:0;padding:0;max-width:none}
 .toolbar,.instructions,h1,.status{display:none!important}
 .card{box-shadow:none;border:2px solid var(--orange);break-inside:avoid;margin:0;padding-bottom:14px;border-radius:18px}
 .card-top{padding:17px 9px 15px;margin-bottom:12px}
 .qr-brand-block{margin-top:12px;padding:8px}
 .qr-bite-logo{width:57px;height:57px}
 .qr-brand-text strong{font-size:29px}
 .qr-frame{padding:14px}
}
@media(max-width:460px){
 main{margin:14px auto}.toolbar{flex-direction:column}
 .card{padding:0 12px 18px}
 .card-top{margin-left:-12px;margin-right:-12px}
 .qr-frame{padding:12px}
 .qr-bite-logo{width:63px;height:63px}
}
</style>
<link rel="stylesheet" href="assets/qr-card-premium.css?v=20261114-brand1">
<link rel="stylesheet" href="assets/bite-selected-logo-rollout.css?v=20261114-logo1">
</head>
<body class="bite-qr-print">
<main>
<h1>Restaurant Menu QR</h1>
<p class="instructions">Same restaurant QR har table par laga sakte hain. Customer QR scan karke sirf menu dekhega. Order waiter lega aur owner POS mein bill banayega.</p>
<article class="card" aria-label="Printable Bite restaurant QR menu card">
<div class="card-top">
  <span class="qr-heading">Scan • View Menu</span>
  <strong id="restaurantName">Restaurant</strong>
  <p class="scan-caption">Scan karein · Menu dekhein</p>
</div>
<div class="qr-frame"><div id="code" aria-label="Restaurant menu QR code"></div></div>
<div class="qr-brand-block">
  <img id="biteBrandLogo" class="qr-bite-logo" src="assets/bite-selected-wordmark.webp" alt="Bite — Eat. Repeat. official logo">
</div>
<div class="menu-tagline">Menu only · Order waiter ko batayein</div>
<div id="menuLink"></div>
</article>
<div class="toolbar">
<button id="printBtn" type="button" disabled>Print QR Card</button>
<button id="downloadBtn" type="button" class="secondary" disabled>Download QR Card</button>
<button id="copyBtn" type="button" class="secondary" disabled>Copy menu link</button>
</div>
<p class="status" id="status" role="status" aria-live="polite">Restaurant verify ho raha hai...</p>
</main>
<script src="assets/vendor/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
'use strict';
const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
const restaurantId=new URLSearchParams(location.search).get('restaurant');
const $=id=>document.getElementById(id);
const status=message=>$('status').textContent=message;
async function start(){
 if(!UUID.test(restaurantId||'')){status('QR link sahi nahi hai. Owner Menu page se dobara QR kholein.');return}
 if(!window.supabase?.createClient||!window.QRCode){status('QR library load nahi hui. Page reload karein.');return}
 const sb=window.supabase.createClient('https://wedbgpybbgsszcmffoha.supabase.co','sb_publishable_9rvWwRCJ86dz13perbmcSg_SE4iFnXn',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
 try{
  const {data,error}=await sb.rpc('list_public_restaurants');
  if(error)throw error;
  const r=(data||[]).find(item=>item.id===restaurantId);
  if(!r){status('Restaurant ka menu public/published nahi hai. Owner pehle restaurant publish karein.');return}
  const menuUrl=new URL('menu-qr.html',location.href);
  menuUrl.search='';
  menuUrl.searchParams.set('restaurant',restaurantId);
  const url=menuUrl.href;
  $('restaurantName').textContent=r.name||'Restaurant';
  $('menuLink').textContent=url;
  // Bite-purple modules match the storefront; white quiet zone ensures clear scan contrast.
  new QRCode($('code'),{text:url,width:260,height:260,colorDark:'#35166e',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
  $('printBtn').disabled=false;$('downloadBtn').disabled=false;$('copyBtn').disabled=false;
  $('printBtn').addEventListener('click',()=>window.print());
  $('downloadBtn').addEventListener('click',async()=>{
    const qrCanvas=$('code').querySelector('canvas');
    const qrImage=$('code').querySelector('img');
    if(!qrCanvas&&!qrImage){status('QR image ready nahi hai. Dobara try karein.');return}
    const button=$('downloadBtn');button.disabled=true;
    try{
      // Export the FULL branded card, not just the QR squares.
      const canvas=document.createElement('canvas');canvas.width=900;canvas.height=1200;
      const ctx=canvas.getContext('2d');if(!ctx)throw Error('Canvas unavailable');
      ctx.fillStyle='#ffffff';ctx.fillRect(0,0,900,1200);
      ctx.fillStyle='#35166e';ctx.fillRect(0,0,900,32);ctx.fillRect(0,1178,900,22);
      ctx.fillStyle='#f77b1a';ctx.fillRect(0,30,900,6);
      ctx.fillStyle='#f4effb';ctx.fillRect(0,36,900,241);
      ctx.textAlign='center';ctx.fillStyle='#35166e';ctx.font='900 25px system-ui,sans-serif';
      ctx.fillText('SCAN  •  VIEW MENU',450,107);
      ctx.fillStyle='#30253b';ctx.font='900 47px system-ui,sans-serif';
      const name=r.name||'Restaurant';
      const words=name.split(/\s+/),lines=[];let line='';
      for(const word of words){
        const candidate=line?line+' '+word:word;
        if(line&&ctx.measureText(candidate).width>790){lines.push(line);line=word}else line=candidate;
      }
      if(line)lines.push(line);
      lines.slice(0,2).forEach((text,index)=>ctx.fillText(text.length>34?text.slice(0,33)+'…':text,450,170+index*52));
      ctx.font='700 26px system-ui,sans-serif';ctx.fillStyle='#664582';
      ctx.fillText('Scan karein  •  Menu dekhein',450,255);
      // White quiet zone protects scanning, especially when printed.
      ctx.fillStyle='#ffffff';ctx.fillRect(179,300,542,542);
      ctx.strokeStyle='#d5c5ea';ctx.lineWidth=4;ctx.strokeRect(179,300,542,542);
      ctx.drawImage(qrCanvas||qrImage,210,331,480,480);
      const logo=$('biteBrandLogo');
      if(!logo.complete){try{await logo.decode()}catch(e){/* Fallback below. */}}
      if(!logo.naturalWidth)throw Error('Bite official logo could not load');
      // Export the exact selected Bite image, including its chef hat,
      // food-cloche emblem, fork underline, name and Eat. Repeat. tagline.
      ctx.drawImage(logo,212,841,476,196);
      ctx.textAlign='center';ctx.fillStyle='#5f4277';ctx.font='700 22px system-ui,sans-serif';
      ctx.fillText('Menu only  •  Order waiter ko batayein',450,1083);
      ctx.fillStyle='#918391';ctx.font='19px system-ui,sans-serif';ctx.fillText('Bite Digital Menu',450,1130);
      const a=document.createElement('a');a.href=canvas.toDataURL('image/png');
      a.download='bite-branded-menu-qr-'+restaurantId+'.png';
      document.body.append(a);a.click();a.remove();
      status('Selected Bite logo aur tagline ke saath poora QR card download ho gaya.');
    }catch(error){console.error('QR card download',error);status('Branded QR card download nahi hua. Print QR Card se save karein.')}
    finally{button.disabled=false}
  });
  $('copyBtn').addEventListener('click',async()=>{
   try{
    await navigator.clipboard.writeText(url);status('Menu link copy ho gaya. Isi QR ko saare tables par laga sakte hain.');
   }catch(e){status('Copy nahi hua; card ke niche likha link manually copy karein.')}
  });
  status('QR ready. Print karke har table par laga sakte hain. Menu update hone par QR badalne ki zarurat nahi.');
 }catch(error){console.error('Public menu QR setup:',error);status('QR ban nahi paaya. Internet check karke dobara kholein.')}
}
start();
})();
</script>
</body>
</html>
